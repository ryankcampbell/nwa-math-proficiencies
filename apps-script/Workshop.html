<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<style>
/* NWA Math Proficiencies — the program-map look: near-black field, faint grid,
   glowing teal title, teal / mustard / coral / graphite course bands.
   No webfonts: an offline-first app cannot depend on a network fetch for its chrome. */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0a0a0b; --grid:rgba(255,255,255,.035);
  --panel:#141415; --panel-2:#1b1b1d; --panel-3:#232326;
  --line:#2c2c30; --line-2:#3a3a3f;
  --ink:#f3f2ee; --ink-2:#c4c3bd; --ink-3:#8f8e89; --ink-4:#66655f;
  /* program colors (from the curriculum map) */
  --teal:#1B9AAA; --teal-2:#156875; --teal-ink:#5cc9d6; --teal-bg:rgba(27,154,170,.14);
  --gold:#E9C46A; --gold-2:#D4A849;
  --coral:#F4A261; --coral-2:#E76F51;
  --graphite:#505050; --graphite-2:#303030;
  --on-light:#231a05;
  /* strand identity — validated categorical set, dark surface */
  --s-N:#B08A26; --s-E:#5C82E6; --s-G:#D45F3E; --s-F:#1A97A6; --s-D:#9A73E3; --s-C:#5A9E3C; --s-P:#8f8e89;
  --ok:#3fae6a; --warn:#E9C46A; --bad:#E76F51;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.45);
  --title:"Arial Black","Helvetica Neue",Arial,sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f7f5f0; --grid:rgba(0,0,0,.04);
  --panel:#ffffff; --panel-2:#f3f1ec; --panel-3:#ebe8e1;
  --line:#e3dfd6; --line-2:#d4cfc4;
  --ink:#16150f; --ink-2:#47463f; --ink-3:#6c6b63; --ink-4:#97958c;
  --teal-ink:#0d7380; --teal-bg:rgba(27,154,170,.10);
  --s-N:#9A7414; --s-E:#2F64CC; --s-G:#C2492A; --s-F:#008A9E; --s-D:#7A55C9; --s-C:#3F8226; --s-P:#6c6b63;
  --shadow:0 8px 24px rgba(30,25,10,.10);
}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:44px 44px}
a{color:var(--teal-ink);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ── top bar ── */
#bar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
#bar .in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;margin-right:10px;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand img{width:30px;height:30px;border-radius:8px}
.brand small{display:block;font-weight:500;font-size:11px;color:var(--ink-3);letter-spacing:.02em}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:7px 12px;border-radius:9px;color:var(--ink-2);font-size:14px;font-weight:600;white-space:nowrap}
nav.tabs a:hover{background:var(--panel-2);text-decoration:none;color:var(--ink)}
nav.tabs a.on{background:var(--teal-bg);color:var(--teal-ink)}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink-2);flex:0 0 auto}
.iconbtn:hover{color:var(--ink);border-color:var(--line-2)}
.who{font-size:12px;color:var(--ink-3);white-space:nowrap;padding:0 4px}
.ws-banner{background:linear-gradient(90deg,var(--teal-2),var(--teal));color:#fff;font-size:13px;font-weight:600;text-align:center;padding:6px 16px}
.ws-banner b{font-weight:800}

main{max-width:1240px;margin:0 auto;padding:28px 16px 80px}

/* ── hero ── */
.hero{padding:26px 0 8px}
.hero h1{font-family:var(--title);font-weight:900;font-size:clamp(34px,7vw,76px);letter-spacing:-.01em;color:var(--teal);
  text-shadow:0 0 18px rgba(27,154,170,.55),0 0 2px rgba(27,154,170,.9)}
:root[data-theme="light"] .hero h1{text-shadow:none}
.hero p{max-width:720px;color:var(--ink-2);font-size:17px;margin:14px 0 0}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.draft{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:999px;padding:4px 11px;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink);
  padding:9px 15px;border-radius:11px;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-4);text-decoration:none}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.primary:hover{background:#21aebf}
.btn.small{padding:5px 10px;font-size:13px;border-radius:9px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}

/* ── section heads (MIDDLE SCHOOL / HIGH SCHOOL / ELECTIVES) ── */
.band{margin-top:44px}
.band>h2{font-family:var(--title);font-size:clamp(22px,3.4vw,34px);text-transform:uppercase;letter-spacing:.01em;display:inline-block;padding-bottom:10px;position:relative}
.band>h2::after{content:"";position:absolute;left:0;right:6%;bottom:0;height:4px;border-radius:4px;background:var(--accent)}
.band[data-band="ms"]{--accent:var(--teal)} .band[data-band="hs"]{--accent:var(--gold)}
.band[data-band="el"]{--accent:var(--coral)} .band[data-band="st"]{--accent:var(--graphite)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px;margin-top:22px}

/* ── course card ── */
.course{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:170px;padding:22px 18px;border-radius:var(--r);color:#fff;box-shadow:var(--shadow);
  transition:transform .16s ease,box-shadow .16s ease;overflow:hidden}
.course:hover{text-decoration:none;transform:translateY(-3px);box-shadow:0 16px 36px rgba(0,0,0,.5)}
.course b{font-size:21px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1.15}
.course span{font-size:15px;opacity:.88;margin-top:6px}
.course i{font-style:normal;font-size:13px;opacity:.8;margin-top:2px}
.course .arrow{margin-top:12px;font-size:22px;opacity:.85}
.course .count{font-size:11px;font-weight:700;letter-spacing:.06em;opacity:.7;margin-top:10px;text-transform:uppercase}
.c-ms{background:linear-gradient(180deg,var(--teal),var(--teal-2))}
.c-hs{background:linear-gradient(180deg,var(--gold),var(--gold-2));color:var(--on-light)}
.c-el{background:linear-gradient(180deg,var(--coral),var(--coral-2));color:var(--on-light)}
.c-st{background:linear-gradient(180deg,var(--graphite),var(--graphite-2))}

/* ── at-a-glance heat grid ── */
.glance{margin-top:48px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 16px}
.glance-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.glance h2{font-size:20px}
.glance p{margin:4px 0 0;color:var(--ink-3);font-size:14px}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.heat{border-collapse:separate;border-spacing:3px;min-width:860px;width:100%;table-layout:fixed}
.heat col.lab{width:210px}
.heat th{font-size:12px;font-weight:600;color:var(--ink-3);text-align:center;padding:4px 2px;white-space:nowrap}
.heat th.row{text-align:left;padding-right:10px;color:var(--ink-2);font-size:13px}
.heat th.row a{color:inherit;display:flex;align-items:center;gap:8px}
.heat td{height:38px;border-radius:7px;position:relative;padding:0}
.heat td button{all:unset;display:grid;place-items:center;width:100%;height:100%;border-radius:7px;cursor:pointer;
  font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.heat td button:focus-visible{outline:2px solid var(--ink)}
.heat td.empty{background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 6px);opacity:.6}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:0 0 auto}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);margin-top:10px;align-items:center}
.legend .ramp{display:inline-flex;gap:2px}
.legend .ramp i{width:16px;height:10px;border-radius:2px;background:var(--teal)}

/* ── page header ── */
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px}
.crumbs a{color:var(--ink-3)}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.phead h1{font-family:var(--title);font-size:clamp(28px,4.6vw,46px);letter-spacing:-.01em}
.phead p{color:var(--ink-2);margin:8px 0 0;max-width:760px}
.coursehero{border-radius:var(--r);padding:26px 26px 22px;margin-bottom:24px;box-shadow:var(--shadow)}
.coursehero h1{font-family:var(--title);font-size:clamp(26px,4.4vw,44px);text-transform:uppercase}
.coursehero p{margin:6px 0 0;opacity:.9}
.coursehero .meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;
  background:rgba(0,0,0,.18);letter-spacing:.02em}
.c-hs .chip,.c-el .chip{background:rgba(255,255,255,.35)}

/* ── strand chips / segmented control ── */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.seg button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button:hover{border-color:var(--line-2);color:var(--ink)}
.seg button.on{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 18%,var(--panel))}

/* ── strand grid (the template, made live) ── */
.strandhead{border-left:5px solid var(--c);padding:4px 0 4px 16px;margin-bottom:16px}
.strandhead h2{font-size:24px}
.strandhead p{margin:6px 0 0;color:var(--ink-2);max-width:820px}
.sgrid{border-collapse:separate;border-spacing:0;min-width:1640px;width:100%;table-layout:fixed;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sgrid th,.sgrid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
.sgrid tr:last-child>*{border-bottom:0}
.sgrid tr>*:last-child{border-right:0}
.sgrid thead th{background:var(--panel-2);font-size:12px;padding:10px 10px;color:var(--ink-2);white-space:nowrap;position:sticky;top:0}
.sgrid thead th small{display:block;color:var(--ink-4);font-weight:500}
.sgrid thead th .bandbar{display:block;height:3px;border-radius:3px;margin-top:6px}
.sgrid th.tname{position:sticky;left:0;z-index:1;background:var(--panel);width:190px;min-width:190px;padding:12px;font-size:14px}
.sgrid thead th.tname{z-index:2;background:var(--panel-2)}
.sgrid th.tname a{color:var(--ink)}
.sgrid th.tname small{display:block;color:var(--ink-3);font-weight:400;font-size:12px;margin-top:4px}
.sgrid td{padding:0}
.sgrid td.has{background:color-mix(in srgb,var(--c) 9%,transparent)}
.cell{all:unset;box-sizing:border-box;display:block;width:100%;min-height:86px;overflow-wrap:normal;hyphens:auto;padding:12px;cursor:pointer;font-size:14px;line-height:1.45;color:var(--ink-2)}
.cell:hover{background:var(--panel-2)}
.cell.has{color:var(--ink)}
.cell.has:hover{background:rgba(255,255,255,.05)}
.cell .n{display:flex;align-items:center;gap:7px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--ink-3);margin-top:8px;font-variant-numeric:tabular-nums}
.cell .n .bar{display:inline-block;height:6px;border-radius:3px;background:var(--c);width:calc(var(--w,0) * 36px);min-width:5px;flex:0 0 auto}
.cell.has .n{color:var(--ink-2)}
.cell.na{color:var(--ink-4);font-style:italic}
.cell .flags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  border-radius:6px;padding:2px 6px;background:var(--panel-3);color:var(--ink-2);font-style:normal}
.tag.gap{background:color-mix(in srgb,var(--bad) 22%,transparent);color:var(--coral)}
.tag.overlap{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--gold)}
.tag.order,.tag.todo{background:color-mix(in srgb,var(--teal) 22%,transparent);color:var(--teal-ink)}
:root[data-theme="light"] .tag.gap{color:#a3401f}
:root[data-theme="light"] .tag.overlap{color:#8a6408}

/* ── course page lists ── */
.group{margin-top:26px}
.group>h3{display:flex;align-items:center;gap:10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:10px}
.plist{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.plist li{display:flex;gap:14px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.plist li:last-child{border-bottom:0}
.code{font:600 12px/1.9 var(--mono);color:var(--ink-3);min-width:74px;flex:0 0 auto}
.ptext{flex:1 1 auto;min-width:0}
.ptext .sub{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.ptext .sub a{color:var(--ink-3);text-decoration:underline;text-decoration-color:var(--line-2)}
.ptext .was{display:block;font-size:12px;color:var(--ink-4);font-style:italic;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill .dot{width:8px;height:8px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.search{flex:1 1 240px;min-width:0;position:relative}
.search input{width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--panel);padding:0 14px 0 36px;outline:none}
.search input:focus{border-color:var(--teal)}
.search svg{position:absolute;left:12px;top:12px;color:var(--ink-4)}
select.inp,input.inp,textarea.inp{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 10px;outline:none;min-width:0}
select.inp:focus,input.inp:focus,textarea.inp:focus{border-color:var(--teal)}
textarea.inp{width:100%;resize:vertical;min-height:70px;line-height:1.45}

/* ── thread story ── */
.story{position:relative;margin:10px 0 0;padding:0;list-style:none}
.story::before{content:"";position:absolute;left:111px;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--c);opacity:.85}
.story li{display:grid;grid-template-columns:100px 30px 1fr;gap:0 0;align-items:start;padding:10px 0}
.story .when{text-align:right;padding-right:14px;font-size:13px;font-weight:700;color:var(--ink-2)}
.story .when small{display:block;font-weight:500;color:var(--ink-4);font-size:11px}
.story .stop{width:18px;height:18px;border-radius:50%;margin:2px 0 0 4px;background:var(--bg);border:4px solid var(--c);position:relative;z-index:1}
.story li.off .stop{border-color:var(--line-2);width:12px;height:12px;margin:5px 0 0 7px;border-width:3px}
.story li.off .what{color:var(--ink-4);font-style:italic;font-size:13px;padding-top:2px}
.story .what{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.story .what h4{margin:0 0 6px;font-size:15px}
.story .what ul{margin:6px 0 0;padding-left:18px;color:var(--ink-2);font-size:13.5px}
.story .what ul li{display:list-item;padding:2px 0}
.story .what .code{display:inline;min-width:0;margin-right:6px}

/* ── review ── */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{font-size:16px;margin-bottom:6px}
.item{border-top:1px solid var(--line);padding:12px 0}
.item:first-of-type{border-top:0}
.item .row{display:flex;gap:10px;align-items:baseline}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0}
.pair>div{background:var(--panel-2);border-radius:10px;padding:8px 10px;font-size:13px}
.pair .code{display:block;min-width:0;line-height:1.4}
.decide{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.decide button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.decide button.on{border-color:var(--teal);background:var(--teal-bg);color:var(--teal-ink)}
.status{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}

/* ── assign / practice ── */
.split{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.tray{position:sticky;top:76px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.tray h3{font-size:16px}
.tray label{display:block;font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.tray .inp{width:100%}
.picked{max-height:220px;overflow:auto;margin:10px 0 0;padding:0;list-style:none;font-size:13px}
.picked li{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.picked li .code{min-width:64px;line-height:1.5}
.picked button{margin-left:auto;background:none;border:0;color:var(--ink-4);padding:0 4px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.check input{width:18px;height:18px;margin:3px 0 0;accent-color:var(--teal);flex:0 0 auto}
.linkbox{display:flex;gap:6px;margin-top:10px}
.linkbox input{flex:1 1 auto;min-width:0;font:12px var(--mono)}
#qr{margin-top:12px;background:#fff;border-radius:10px;padding:10px;display:inline-block}
#qr img,#qr svg{display:block;width:160px;height:160px}
.practice-head{border-radius:var(--r);padding:26px;margin-bottom:22px;background:linear-gradient(135deg,var(--teal-2),var(--teal));color:#fff;box-shadow:var(--shadow)}
.practice-head h1{font-family:var(--title);font-size:clamp(24px,4vw,40px)}
.practice-head .note{background:rgba(0,0,0,.18);border-radius:12px;padding:12px 14px;margin-top:14px;white-space:pre-wrap}
.progress{height:10px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden;margin-top:16px}
.progress i{display:block;height:100%;background:#fff;border-radius:6px;transition:width .3s}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.pcard.done{opacity:.7}
.pcard.done .ptext b{text-decoration:line-through;text-decoration-color:var(--ink-4)}
.res{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0 30px}
.res a{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;border:1px solid var(--line);border-radius:9px;padding:5px 10px;color:var(--ink)}

<script>
window.NWA_WORKSHOP = true;
window.NWA_DATA = <?!= dataJson ?>;
window.NWA_USER = <?!= userJson ?>;
window.NWA_CHAIR = <?!= chairJson ?>;
</script>
<script>
/* NWA Math — practice sets: self-check problems for one proficiency.

   One JSON per proficiency code, practice/<CODE>.json; practice/index.json lists them.
   Same idea as the Astronomy study sets: static, no accounts, new numbers every try,
   progress only in this browser (localStorage "nwa:q:<question id>" = {right, wrong}).

   Question formats
     mc       choices[] + answer (index into choices); shuffled unless fixed: true
     numeric  answer (expression) + tol; students may type 3/4, -2, 0.75
     point    student taps the grid to place n points; check (expression over X1,Y1,X2,Y2…)
     slider   student sets controls{} so their curve g matches the dashed target; answers{}
   Any question may carry a graph: {window:[x0,x1,y0,y1], fns:[{f, label?, at?, dash?}], points:[[x,y]]}.

   Text is trusted HTML with KaTeX math in $…$. Computed values use double brackets, so
   LaTeX braces stay free:
     [[expr]]    the value                      [[f:expr]]  the value as a reduced fraction (\frac)
     [[+expr]]   a signed term: "+ 3", "- 3", or nothing for 0
     [[c:expr]]  a coefficient: 1 → "", -1 → "-"
   Params: {name: {min, max, step?, not?:[…]}}; derive: {name: expr} in order;
   where: an expression that must be true (resampled until it is).
*/
(() => {
'use strict';

/* ───────────── expressions ───────────── */

const FN = new Map();
const MATH = { sin: Math.sin, cos: Math.cos, tan: Math.tan, sqrt: Math.sqrt, abs: Math.abs, exp: Math.exp,
  ln: Math.log, log: Math.log10, log2: Math.log2, logb: (b, x) => Math.log(x) / Math.log(b),
  pi: Math.PI, round: Math.round, floor: Math.floor, min: Math.min, max: Math.max };
function ev(expr, scope) {
  const keys = Object.keys(scope);
  const sig = keys.join(',') + '|' + expr;
  let f = FN.get(sig);
  if (!f) {
    f = new Function(...Object.keys(MATH), ...keys, `return (${String(expr).replace(/\^/g, '**')});`);
    FN.set(sig, f);
  }
  return f(...Object.values(MATH), ...keys.map(k => scope[k]));
}

const num = n => {
  if (typeof n !== 'number') return String(n);
  if (!isFinite(n)) return '\\text{undefined}';
  return String(Math.round(n * 1e4) / 1e4);
};
const tick = n => (n < 0 ? '−' : '') + Math.abs(n);      // SVG labels: a real minus sign

/* Best fraction with denominator ≤ 100, as LaTeX. */
function frac(x) {
  if (Number.isInteger(Math.round(x * 1e9) / 1e9)) return String(Math.round(x));
  let best = [Math.round(x), 1], err = Infinity;
  for (let d = 2; d <= 100; d++) {
    const n = Math.round(x * d), e = Math.abs(x - n / d);
    if (e < err - 1e-12) { best = [n, d]; err = e; }
    if (e < 1e-9) break;
  }
  const [n, d] = best;
  return (n < 0 ? '-' : '') + `\\frac{${Math.abs(n)}}{${d}}`;
}

function fill(s, v) {
  return String(s ?? '').replace(/\[\[(\+|c:|f:)?(.+?)\]\]/g, (_, mod, ex) => {
    const n = ev(ex, v);
    if (mod === '+') return n === 0 ? '' : (n < 0 ? ' - ' : ' + ') + num(Math.abs(n));
    if (mod === 'c:') return n === 1 ? '' : n === -1 ? '-' : num(n);
    if (mod === 'f:') return frac(n);
    return num(n);
  }).replace(/(^|[^A-Za-z\\])\(x\)/g, '$1x');   // (x[[+-h]]) with h = 0 → x, but f(x) stays
}

function sample(q) {
  for (let tries = 0; tries < 400; tries++) {
    const v = {};
    for (const [k, p] of Object.entries(q.params || {})) {
      const step = p.step || 1, n = Math.round((p.max - p.min) / step);
      let x;
      do { x = +(p.min + step * Math.floor(Math.random() * (n + 1))).toFixed(6); } while ((p.not || []).includes(x));
      v[k] = x;
    }
    for (const [k, ex] of Object.entries(q.derive || {})) v[k] = ev(ex, v);
    if (!q.where || ev(q.where, v)) return v;
  }
  throw new Error('No parameters satisfy ' + q.where);
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('nwa:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nwa:' + k, JSON.stringify(v)); } catch (e) {} },
};

function typeset(el) {
  if (!window.renderMathInElement) return;
  try {
    window.renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '$', right: '$', display: false }], throwOnError: false });
  } catch (e) {}
}

/* ───────────── graph ───────────── */

const W = 360, H = 360;
function plotSvg(g, v, extra = {}) {
  const [x0, x1, y0, y1] = g.window || [-6, 6, -6, 6];
  const X = x => (x - x0) / (x1 - x0) * W, Y = y => H - (y - y0) / (y1 - y0) * H;
  const out = [];
  const every = (lo, hi) => Math.max(1, Math.ceil((hi - lo) / 12));
  const sx = every(x0, x1), sy = every(y0, y1);
  for (let x = Math.ceil(x0); x <= x1; x++) out.push(`<line class="g-grid" x1="${X(x)}" x2="${X(x)}" y1="0" y2="${H}"/>`);
  for (let y = Math.ceil(y0); y <= y1; y++) out.push(`<line class="g-grid" y1="${Y(y)}" y2="${Y(y)}" x1="0" x2="${W}"/>`);
  const ax = y0 <= 0 && y1 >= 0, ay = x0 <= 0 && x1 >= 0;
  if (ax) out.push(`<line class="g-axis" x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}"/>`);
  if (ay) out.push(`<line class="g-axis" y1="0" y2="${H}" x1="${X(0)}" x2="${X(0)}"/>`);
  const ly = ax ? Y(0) : H - 4, lx = ay ? X(0) : 4;
  for (let x = Math.ceil(x0 / sx) * sx; x <= x1; x += sx) if (x && x > x0 && x < x1)
    out.push(`<text class="g-tick" x="${X(x)}" y="${Math.min(H - 4, ly + 15)}" text-anchor="middle">${tick(x)}</text>`);
  for (let y = Math.ceil(y0 / sy) * sy; y <= y1; y += sy) if (y && y > y0 && y < y1)
    out.push(`<text class="g-tick" x="${lx > 26 ? lx - 6 : lx + 6}" y="${Y(y) + 4}" text-anchor="${lx > 26 ? 'end' : 'start'}">${tick(y)}</text>`);
  const curve = (f, cls) => {
    let d = '', pen = false;
    for (let i = 0; i <= 600; i++) {
      const x = x0 + (x1 - x0) * i / 600;
      let y; try { y = ev(f, { ...v, x }); } catch (e) { y = NaN; }
      if (!isFinite(y) || y < y0 - (y1 - y0) || y > y1 + (y1 - y0)) { pen = false; continue; }
      d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1);
      pen = true;
    }
    return `<path class="${cls}" d="${d}"/>`;
  };
  (g.fns || []).forEach((fn, i) => {
    out.push(curve(fn.f, `g-fn c${i}${fn.dash ? ' dash' : ''}`));
    if (fn.label) {
      const lx2 = fn.at != null ? ev(fn.at, v) : x0 + (x1 - x0) * 0.85, ly2 = ev(fn.f, { ...v, x: lx2 });
      out.push(`<text class="g-label c${i}" x="${X(lx2) + 8}" y="${Y(ly2) + 4}">${fn.label}</text>`);
    }
  });
  if (extra.student) out.push(curve(extra.student, 'g-fn student'));
  for (const [px, py] of g.points || []) out.push(`<circle class="g-pt" cx="${X(ev(px, v))}" cy="${Y(ev(py, v))}" r="5.5"/>`);
  (extra.placed || []).forEach(([px, py]) => {
    const right = X(px) < W - 70;
    out.push(`<circle class="g-pt placed" cx="${X(px)}" cy="${Y(py)}" r="7"/>
      <text class="g-coord" x="${X(px) + (right ? 11 : -11)}" y="${Y(py) - 10}" text-anchor="${right ? 'start' : 'end'}">(${tick(px)}, ${tick(py)})</text>`);
  });
  if (extra.interactive) out.push(`<rect class="g-hit" x="0" y="0" width="${W}" height="${H}"/>`);
  return `<svg class="graph${extra.interactive ? ' interactive' : ''}" viewBox="-2 -2 ${W + 4} ${H + 4}" role="img" aria-label="Coordinate graph">${out.join('')}</svg>`;
}
function toCoords(svg, e, g) {
  const [x0, x1, y0, y1] = g.window || [-6, 6, -6, 6];
  const r = svg.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  const snap = g.snap || 1;
  return [Math.round((x0 + fx * (x1 - x0)) / snap) * snap, Math.round((y1 - fy * (y1 - y0)) / snap) * snap];
}

/* ───────────── one question ───────────── */

/* The student's curve: slider values written into g, e.g. "A*sin(x)" → "(3)*sin(x)". */
const bind = (g, ctl) => g.replace(/\b([A-Za-z]\w*)\b/g, m => m in ctl ? `(${ctl[m]})` : m);

function fresh(q) {
  const it = { v: sample(q), placed: [], result: null, given: null };
  if (q.format === 'mc') it.order = q.fixed ? q.choices.map((_, i) => i) : shuffle(q.choices.map((_, i) => i));
  if (q.format === 'slider') it.ctl = Object.fromEntries(Object.entries(q.controls).map(([k, c]) => [k, c.start ?? c.min]));
  return it;
}

function parseNum(s) {
  s = String(s).trim().replace(/[−–]/g, '-').replace(/\s+/g, '');
  if (/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)) { const [a, b] = s.split('/'); return +a / +b; }
  return s === '' ? NaN : Number(s);
}

function grade(q, it, root) {
  const v = it.v;
  switch (q.format) {
    case 'mc': {
      const pick = root.querySelector('input[name="mc"]:checked');
      if (!pick) return null;
      it.given = +pick.value;
      return it.given === q.answer;
    }
    case 'numeric': {
      const n = parseNum(root.querySelector('.q-num').value);
      if (isNaN(n)) return null;
      it.given = root.querySelector('.q-num').value;
      return Math.abs(n - ev(q.answer, v)) <= (q.tol ?? 0.01);
    }
    case 'point': {
      if (it.placed.length < (q.n || 1)) return null;
      const s = { ...v };
      it.placed.forEach(([x, y], i) => { s['X' + (i + 1)] = x; s['Y' + (i + 1)] = y; });
      return !!ev(q.check, s);
    }
    case 'slider':
      return Object.entries(q.answers).every(([k, ex]) => Math.abs(it.ctl[k] - ev(ex, v)) <= (q.controls[k].tol ?? (q.controls[k].step || 1) / 2 + 1e-9));
  }
}

function answerText(q, v) {
  if (q.format === 'mc') return fill(q.choices[q.answer], v);
  if (q.format === 'numeric') { const a = ev(q.answer, v); return `$${Number.isInteger(Math.round(a * 1e9) / 1e9) ? num(a) : frac(a)}$` + (q.units ? ' ' + q.units : ''); }
  return '';
}

const LET = 'ABCDEF';
function qHtml(q, it) {
  const v = it.v, done = it.result != null;
  const g = q.graph || (q.format === 'point' || q.format === 'slider' ? {} : null);
  const graph = g ? `<div class="q-graph">${plotSvg(g, v, { placed: it.placed, interactive: q.format === 'point' && !done, student: q.format === 'slider' ? bind(q.g, it.ctl) : null })}
    ${q.format === 'slider' ? '<div class="q-legend"><span class="sw target"></span>target <span class="sw mine"></span>yours</div>' : ''}</div>` : '';
  let ans = '';
  if (q.format === 'mc') ans = `<div class="q-choices" role="radiogroup">${it.order.map((i, k) => {
    const cls = done ? (i === q.answer ? ' right' : i === it.given ? ' wrong' : '') : '';
    return `<label class="q-choice${cls}"><input type="radio" name="mc" value="${i}" ${done ? 'disabled' : ''} ${it.given === i ? 'checked' : ''}><span class="let">${LET[k]}</span><span class="txt">${fill(q.choices[i], v)}</span></label>`;
  }).join('')}</div>`;
  if (q.format === 'numeric') ans = `<div class="q-numrow"><input class="inp q-num" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Your answer" aria-label="Your answer" ${done ? `disabled value="${String(it.given).replace(/"/g, '&quot;')}"` : ''}>${q.units ? `<span class="muted">${q.units}</span>` : ''}</div>
    <div class="q-hint">Fractions like 3/4 are fine.</div>`;
  if (q.format === 'point') ans = `<div class="q-hint"><span class="tapdot"></span>Tap the grid to place ${q.n > 1 ? q.n + ' points' : 'your point'}; tap again to move it.</div>`;
  if (q.format === 'slider') ans = `<div class="q-sliders">${Object.entries(q.controls).map(([k, c]) => `<label class="q-slider"><span class="k">$${c.label || k}$</span><input type="range" min="${c.min}" max="${c.max}" step="${c.step || 1}" value="${it.ctl[k]}" data-ctl="${k}" ${done ? 'disabled' : ''}><output>${num(it.ctl[k]).replace('-', '−')}</output></label>`).join('')}</div>
    <div class="q-mine">$${fill(q.show || q.g, it.ctl)}$</div>`;
  const res = !done ? '' : `<div class="q-result ${it.result ? 'ok' : 'no'}">
    <div class="q-verdict">${it.result ? '<span class="mark">✓</span> Correct' : '<span class="mark">✗</span> Not quite'}${!it.result && answerText(q, v) ? `<span class="q-correct">Answer: ${answerText(q, v)}</span>` : ''}</div>
    ${q.explain ? `<div class="q-explain">${fill(q.explain, v)}</div>` : ''}</div>`;
  return `<div class="q-stem">${fill(q.stem, v)}</div>
    <div class="q-body${graph ? ' has-graph' : ''}">${graph}<div class="q-ans">${ans}${res}</div></div>`;
}

/* ───────────── a set ───────────── */

function mount(el, set, opts = {}) {
  const qs = set.questions;
  const its = qs.map(fresh);
  let idx = 0;

  function draw() {
    const q = qs[idx], it = its[idx];
    const right = its.filter(i => i.result === true).length;
    el.innerHTML = `
      <div class="q-head">
        <div class="q-dots">${qs.map((x, i) => { const r = its[i].result; return `<button class="q-dot${i === idx ? ' on' : ''}${r === true ? ' ok' : r === false ? ' no' : ''}" data-q="go" data-i="${i}" aria-label="Question ${i + 1}${r === true ? ', correct' : r === false ? ', missed' : ''}">${i + 1}</button>`; }).join('')}</div>
        <div class="q-score">${right} / ${qs.length} correct</div>
      </div>
      <article class="q-card">
        <div class="q-meta"><span>Question ${idx + 1} of ${qs.length}</span>${q.kind ? `<span class="q-kind${/Interactive/.test(q.kind) ? ' live' : ''}">${q.kind}</span>` : ''}</div>
        ${qHtml(q, it)}
        <div class="q-actions">
          ${it.result == null ? '<button class="btn primary" data-q="check">Check</button>' : '<button class="btn" data-q="again">↻ Try one like it</button>'}
          ${idx < qs.length - 1 ? `<button class="btn ${it.result != null ? 'primary' : 'ghost'}" data-q="next">Next →</button>` : `<button class="btn ${it.result != null ? 'primary' : 'ghost'}" data-q="done">Finish</button>`}
          <span class="q-need" aria-live="polite"></span>
        </div>
      </article>`;
    typeset(el);
    wire(q, it);
  }

  function summary() {
    const right = its.filter(i => i.result === true).length;
    el.innerHTML = `<article class="q-card q-summary">
      <div class="ring" style="--p:${100 * right / qs.length}"><b>${right}/${qs.length}</b></div>
      <h2>${right === qs.length ? 'All correct.' : right ? 'Good progress.' : 'Keep going.'}</h2>
      <p class="muted">${right === qs.length ? 'Come back in a few days and try a fresh set of numbers.' : 'Try the missed ones again. Every try gives new numbers.'}</p>
      <div class="q-actions" style="justify-content:center"><button class="btn primary" data-q="restart">New numbers, start over</button>
      ${opts.back ? `<a class="btn" href="${opts.back}">← Back to the list</a>` : ''}</div></article>`;
    wire();
  }

  function wire(q, it) {
    el.querySelectorAll('[data-q]').forEach(b => b.addEventListener('click', e => {
      e.preventDefault();
      const a = b.dataset.q;
      if (a === 'go') { idx = +b.dataset.i; draw(); }
      if (a === 'next') { idx++; draw(); }
      if (a === 'done') summary();
      if (a === 'restart') { qs.forEach((x, i) => { its[i] = fresh(x); }); idx = 0; draw(); }
      if (a === 'again') { its[idx] = fresh(q); draw(); }
      if (a === 'check') {
        const r = grade(q, it, el);
        if (r == null) { el.querySelector('.q-need').textContent = q.format === 'point' ? 'Place your point first.' : 'Answer first.'; return; }
        it.result = r;
        const h = store.get('q:' + q.id, { right: 0, wrong: 0 }); h[r ? 'right' : 'wrong']++; store.set('q:' + q.id, h);
        draw();
      }
    }));
    if (!q) return;
    // Listen on the holder, which survives redraws of the svg inside it.
    const holder = el.querySelector('.q-graph');
    if (holder && el.querySelector('svg.graph.interactive')) holder.addEventListener('click', e => {
      const svg = holder.querySelector('svg');
      const p = toCoords(svg, e, q.graph || {});
      it.placed = it.placed.length < (q.n || 1) ? [...it.placed, p] : [...it.placed.slice(1), p];
      holder.innerHTML = plotSvg(q.graph || {}, it.v, { placed: it.placed, interactive: true });
      el.querySelector('.q-need').textContent = '';
    });
    el.querySelectorAll('input[data-ctl]').forEach(r => r.addEventListener('input', () => {
      it.ctl[r.dataset.ctl] = +r.value;
      r.nextElementSibling.textContent = num(+r.value).replace('-', '−');
      el.querySelector('.q-graph svg').outerHTML = plotSvg(q.graph || {}, it.v, { student: bind(q.g, it.ctl) });
      const mine = el.querySelector('.q-mine');
      mine.textContent = '$' + fill(q.show || q.g, it.ctl) + '$';
      typeset(mine);
    }));
    el.querySelectorAll('.q-choice input').forEach(r => r.addEventListener('change', () => {
      el.querySelectorAll('.q-choice').forEach(c => c.classList.toggle('sel', c.contains(r) && r.checked));
    }));
    const n = el.querySelector('.q-num');
    if (n && !n.disabled) n.addEventListener('keydown', e => { if (e.key === 'Enter') el.querySelector('[data-q="check"]')?.click(); });
  }

  draw();
}

window.NWAPractice = { mount, fill, sample, ev, frac, plotSvg };
})();

</script>
<script>
/* NWA Math Proficiencies — one app, two homes.

   Public site (GitHub Pages): reads data/data.json, read-only, works offline.
   Workshop (Google Apps Script): the same file, served with window.NWA_WORKSHOP
   set and the live Sheet's data inlined as window.NWA_DATA; edits go to the
   Sheet through google.script.run.

   Views (hash routes):
     #/                 program map + scope at a glance
     #/course/IM3       one course's proficiencies, by unit or by strand
     #/scope/F          one strand: threads × courses (the admin template, live)
     #/thread/F3        one thread followed from 6th grade up
     #/review           overlaps and open questions for the department
     #/assign           teacher builds a practice link
     #/p?s=…            student practice page (what an assignment link opens)
     #/c/K7QM4          a class code: looked up in data/plans.json, then opens its #/p page
     #/q/IM3-14         practice problems for one proficiency (practice.js)
*/
(() => {
'use strict';

const WS = !!window.NWA_WORKSHOP;
const PUBLIC_URL = 'https://ryankcampbell.github.io/nwa-math-proficiencies/';
const BASE = WS ? PUBLIC_URL : '';          // where published files (practice sets, plans) live
const VENDOR = WS ? {
  xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
  qr: 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js',
} : { xlsx: 'vendor/xlsx.full.min.js', qr: 'vendor/qrcode.min.js' };

/* Which earlier courses feed each course — drives "prepare for…" in Assign. */
const FEEDS = {
  PA2: ['PA1'], PA3: ['PA2'], IM1: ['PA3'], IM2: ['IM1'], IM3: ['IM2'],
  PC: ['IM3'], APC: ['IM3'], CALC: ['APC', 'PC'], ST1: ['IM3'], ST2: ['ST1'],
};
const BAND_NAME = { ms: 'Middle School', hs: 'High School', el: 'Electives', st: 'Statistics' };
const KIND = { gap: 'Gap', overlap: 'Overlap', order: 'Sequence', todo: 'To do' };

let D, C, S, T, P;          // data; course, strand, thread, proficiency maps
let PX = {};                // practice/index.json: code → {title, n}
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const store = {
  get(k, d) { try { const v = localStorage.getItem('nwa:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nwa:' + k, JSON.stringify(v)); } catch (e) {} },
};

/* ───────────────────────── data ───────────────────────── */

function index() {
  C = new Map(D.courses.map(c => [c.id, c]));
  S = new Map(D.strands.map(s => [s.id, s]));
  T = new Map(D.threads.map(t => [t.id, t]));
  P = new Map(D.profs.map(p => [p.code, p]));
  D.courses.sort((a, b) => a.order - b.order);
  D.strands.sort((a, b) => a.order - b.order);
  D.threads.sort((a, b) => a.order - b.order);
  D.resources = D.resources || [];
  D.overlaps = D.overlaps || [];
  D.flags = D.flags || [];
}
const live = () => D.profs.filter(p => p.status !== 'retired');
const ofCourse = cid => live().filter(p => p.course === cid);
const inCell = (tid, cid) => live().filter(p => p.thread === tid && p.course === cid);
const threadsOf = sid => D.threads.filter(t => t.strand === sid);
const strandOf = p => { const t = T.get(p.thread); return t ? S.get(t.strand) : null; };
const resOf = code => D.resources.filter(r => r.code === code);
const flagsAt = (tid, cid) => D.flags.filter(f => f.thread === tid && f.course === cid && f.status !== 'resolved');
const openOverlapsOf = code => D.overlaps.filter(o => o.status === 'open' && (o.a === code || o.b === code));
const sc = sid => `var(--s-${sid})`;
const showOv = () => store.get('ovShow', false);   // overlap badges: off unless asked for (they crowd the grid)

async function load() {
  if (window.NWA_DATA) { D = window.NWA_DATA; index(); return; }
  const res = await fetch('data/data.json', { cache: 'no-cache' });
  D = await res.json();
  index();
}
async function loadPractice() {
  try { PX = (await (await fetch(BASE + 'practice/index.json', { cache: 'no-cache' })).json()).sets || {}; } catch (e) { PX = {}; }
}

/* ───────────────────────── workshop API ───────────────────────── */

function api(op) {
  return new Promise((resolve, reject) => {
    if (!WS) return reject(new Error('read-only'));
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apply(op);
  });
}

/* Mirror of the server's apply(): patch local data so the page updates at once. */
function patch(op, r) {
  const p = op.code && P.get(op.code);
  switch (op.op) {
    case 'moveProf': p.thread = op.thread; break;
    case 'editProf': if (!p.was) p.was = p.text; p.text = op.text; break;
    case 'addProf': D.profs.push(r); P.set(r.code, r); break;
    case 'retireProf': p.status = 'retired'; break;
    case 'setCell': T.get(op.thread).cells[op.course] = op.text; break;
    case 'renameThread': T.get(op.thread).name = op.name; break;
    case 'setThreadNote': T.get(op.thread).note = op.note; break;
    case 'addThread': D.threads.push(r); T.set(r.id, r); break;
    case 'decideOverlap': Object.assign(D.overlaps.find(o => o.id === op.id), { status: op.status, note: op.note ?? '' }); break;
    case 'setFlag': D.flags.find(f => f.id === op.id).status = op.status; break;
    case 'addFlag': D.flags.push(r); break;
    case 'addResource': case 'uploadResource': D.resources.push(r); break;
    case 'deleteResource': D.resources = D.resources.filter(x => x.id !== op.id); break;
  }
}

async function edit(op, msg) {
  try {
    const r = await api(op);
    patch(op, r);
    toast(msg || 'Saved');
    render();
    return r;
  } catch (e) {
    toast('Not saved: ' + (e.message || e));
    throw e;
  }
}

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ───────────────────────── shared bits ───────────────────────── */

const icon = {
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sun: '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  dl: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
};

function strandPill(t) {
  if (!t) return '<span class="pill muted">Unsorted</span>';
  return `<a class="pill" href="#/thread/${t.id}" style="--c:${sc(t.strand)}"><span class="dot"></span>${esc(t.name)}</a>`;
}

function threadSelect(p) {
  return `<select class="inp" data-act="move" data-code="${p.code}" aria-label="Move ${p.code} to a thread">
    ${D.strands.map(s => `<optgroup label="${esc(s.name)}">${threadsOf(s.id).map(t =>
      `<option value="${t.id}" ${t.id === p.thread ? 'selected' : ''}>${esc(t.name)}</option>`).join('')}</optgroup>`).join('')}
  </select>`;
}

function profRow(p, { showCourse = false, showThread = true } = {}) {
  const c = C.get(p.course), t = T.get(p.thread), rs = resOf(p.code), ov = openOverlapsOf(p.code);
  return `<li data-code="${p.code}">
    <span class="code">${p.code}</span>
    <div class="ptext">
      ${esc(p.text)}${p.level === 'unit' ? ' <span class="tag">Unit</span>' : ''}${p.new ? ' <span class="tag">New</span>' : ''}
      <span class="sub">${showCourse ? `<a href="#/course/${c.id}">${esc(c.name)}</a> · ` : ''}${p.unit && showCourse ? esc(p.unit) + ' · ' : ''}${rs.length ? `${rs.length} resource${rs.length > 1 ? 's' : ''}` : ''}${p.note ? ' ' + esc(p.note) : ''}${PX[p.code] ? ` <a class="tag prac" href="#/q/${p.code}">Practice · ${PX[p.code].n}</a>` : ''}</span>
      ${WS && p.was ? `<span class="was">was: ${esc(p.was)}</span>` : ''}
      ${showOv() && ov.length ? `<span class="sub">${ov.map(o => { const other = o.a === p.code ? o.b : o.a; return `<span class="tag overlap">Overlaps ${other}</span>`; }).join(' ')}</span>` : ''}
      ${WS ? `<div class="ws-row">
        ${threadSelect(p)}
        <button class="btn small ghost" data-act="editProf" data-code="${p.code}">Edit wording</button>
        <button class="btn small ghost" data-act="addRes" data-code="${p.code}">Add resource</button>
        <button class="btn small ghost" data-act="retire" data-code="${p.code}">Retire</button>
      </div>` : ''}
    </div>
    ${showThread && !WS ? strandPill(t) : ''}
  </li>`;
}

/* ───────────────────────── views ───────────────────────── */

function vHome() {
  const bands = ['ms', 'hs', 'el', 'st'];
  const counts = new Map(D.courses.map(c => [c.id, ofCourse(c.id).length]));
  return `
  <section class="hero">
    ${D.status === 'draft' ? `<span class="draft">● Draft for department review · ${esc(D.year)}</span>` : ''}
    <h1>NWA Mathematics Program</h1>
    <p>What we teach, and when. Tap a course for its proficiencies, or follow a strand to see how an idea grows from 6th grade through Calculus.</p>
    <div class="ctas">
      <a class="btn primary" href="#/scope/${D.strands[0].id}">Scope &amp; Sequence</a>
      <a class="btn" href="#/assign">Assign practice</a>
      <button class="btn" data-act="xlsx">${icon.dl} Download Excel</button>
    </div>
    ${WS ? '' : codeBox()}
  </section>
  ${bands.map(b => {
    const cs = D.courses.filter(c => c.band === b);
    if (!cs.length) return '';
    return `<section class="band" data-band="${b}">
      <h2>${BAND_NAME[b]}</h2>
      <div class="cards">${cs.map(c => `
        <a class="course c-${c.band}" href="#/course/${c.id}">
          <b>${esc(c.name)}</b><span>${esc(c.grade)}</span>${c.tagline ? `<i>${esc(c.tagline)}</i>` : ''}
          <span class="count">${counts.get(c.id)} proficiencies</span>
          <div class="arrow" aria-hidden="true">⟶</div>
        </a>`).join('')}</div>
    </section>`;
  }).join('')}
  ${vGlance()}`;
}

function vGlance() {
  const rows = D.strands.map(s => {
    const per = D.courses.map(c => live().filter(p => p.course === c.id && T.get(p.thread)?.strand === s.id).length);
    return { s, per };
  });
  const max = Math.max(1, ...rows.flatMap(r => r.per));
  return `<section class="glance">
    <div class="glance-head">
      <div><h2>Scope at a glance</h2><p>Each row is a strand that runs through the whole program. Darker cells hold more proficiencies.</p></div>
      <a class="btn small" href="#/scope/${D.strands[0].id}">Open the full grid →</a>
    </div>
    <div class="scroller"><table class="heat" role="grid">
      <colgroup><col class="lab">${D.courses.map(() => '<col>').join('')}</colgroup>
      <thead><tr><th></th>${D.courses.map(c => `<th scope="col" title="${esc(c.name)}">${esc(c.short)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(({ s, per }) => `<tr>
        <th scope="row" class="row"><a href="#/scope/${s.id}" style="--c:${sc(s.id)}"><span class="dot"></span>${esc(s.name)}</a></th>
        ${per.map((n, i) => {
          const c = D.courses[i];
          if (!n) return `<td class="empty" title="${esc(s.name)} · ${esc(c.name)}: not covered"></td>`;
          const w = (0.18 + 0.72 * n / max).toFixed(2);
          return `<td style="background:color-mix(in srgb,${sc(s.id)} ${Math.round(w * 100)}%,transparent)">
            <button data-act="glance" data-strand="${s.id}" data-course="${c.id}" aria-label="${esc(s.name)}, ${esc(c.name)}: ${n} proficiencies" title="${esc(s.name)} · ${esc(c.name)}: ${n}">${n}</button></td>`;
        }).join('')}
      </tr>`).join('')}</tbody>
    </table></div>
    <div class="legend"><span>Fewer</span><span class="ramp">${[.2, .4, .6, .8, 1].map(o => `<i style="opacity:${o}"></i>`).join('')}</span><span>More proficiencies</span>
      <span style="margin-left:12px;display:inline-flex;align-items:center;gap:6px"><i style="display:inline-block;width:16px;height:10px;border-radius:2px;background:repeating-linear-gradient(135deg,transparent 0 3px,var(--line-2) 3px 4px)"></i> Not covered</span></div>
  </section>`;
}

function vCourse(cid) {
  const c = C.get(cid);
  if (!c) return vMissing();
  const ps = ofCourse(cid);
  const mode = store.get('courseMode', 'unit');
  const hasUnits = ps.some(p => p.unit);
  let body;
  if (mode === 'strand' || !hasUnits) {
    body = D.strands.map(s => {
      const g = ps.filter(p => T.get(p.thread)?.strand === s.id);
      if (!g.length) return '';

/* Link format: #/p?s=IM3.05.07~PC.01&t=title&n=note&d=2027-08-20
   Codes are grouped by course prefix so a 20-item list stays short. */
function encodeCodes(codes) {
  const g = new Map();
  for (const code of codes) {
    const i = code.indexOf('-');
    const k = code.slice(0, i);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(code.slice(i + 1));
  }
  return [...g].map(([k, v]) => [k, ...v].join('.')).join('~');
}
function decodeCodes(s) {
  return (s || '').split('~').filter(Boolean).flatMap(part => {
    const [k, ...v] = part.split('.');
    return v.map(x => `${k}-${x}`);
  });
}
function practiceUrl(st) {
  const q = new URLSearchParams();
  q.set('s', encodeCodes(st.picked));
  if (st.title) q.set('t', st.title);
  if (st.note) q.set('n', st.note);
  if (st.due) q.set('d', st.due);
  const base = WS ? PUBLIC_URL : location.origin + location.pathname;
  return `${base}#/p?${q.toString()}`;
}

function khan(p) {
  return 'https://www.khanacademy.org/search?page_search_query=' + encodeURIComponent(p.text.replace(/\(.*?\)/g, ''));
}

function vPractice(params) {
  const codes = decodeCodes(params.get('s'));

  const missing = codes.filter(c => !P.has(c));

  const n = ps.filter(p => done.has(p.code)).length;

  return `
  <section class="practice-head">

    ${due ? `<div style="margin-top:6px;font-weight:600">Due ${esc(new Date(due + 'T12:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }))}</div>` : ''}
    ${params.get('n') ? `<div class="note">${esc(params.get('n'))}</div>` : ''}
    <div class="progress" aria-label="${n} of ${ps.length} done"><i style="width:${ps.length ? 100 * n / ps.length : 0}%"></i></div>

  </section>
  <div class="toolbar noprint" style="margin-bottom:14px"><button class="btn small" onclick="window.print()">Print this list</button></div>
  ${ps.map(p => {
    const c = C.get(p.course), rs = resOf(p.code);
    return `<div class="pcard ${done.has(p.code) ? 'done' : ''}">
      <label class="check"><input type="checkbox" data-act="did" data-key="${esc(key)}" data-code="${p.code}" ${done.has(p.code) ? 'checked' : ''}>
        <span class="ptext"><b>${esc(p.text)}</b><span class="sub">${p.code} · ${esc(c.name)}${p.unit ? ' · ' + esc(p.unit) : ''}</span></span></label>
      <div class="res">${PX[p.code] ? `<a class="prac" href="#/q/${p.code}?back=${back}"><span class="kind">practice</span>${PX[p.code].n} self-check problems</a>` : ''}${rs.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener"><span class="kind">${esc(r.kind || 'link')}</span>${esc(r.title)}</a>`).join('')}
        <a class="fallback" href="${khan(p)}" target="_blank" rel="noopener">Search Khan Academy ↗</a></div>
    </div>`;
  }).join('')}
  ${missing.length ? `<p class="muted">Some items on this link (${missing.map(esc).join(', ')}) are no longer in the curriculum. Ask your teacher.</p>` : ''}
  ${!ps.length ? '<div class="empty-note">This link has no proficiencies on it. Ask your teacher for a new one.</div>' : ''}`;
}

/* Class codes: data/plans.json is written by the Workshop when a teacher saves a plan.
   The code resolves to an ordinary #/p link, so the page then works offline like any link.
   Codes a student has opened are remembered on this device (store 'mine'). */
const CODE_RE = /^[A-HJKMNP-Z2-9]{5}$/;   // no 0/O, 1/I/L: easy to read aloud and type
function remember(code, title, hash) {
  const mine = store.get('mine', []).filter(m => m.code !== code);
  mine.unshift({ code, title, hash, at: Date.now() });
  store.set('mine', mine.slice(0, 12));
}
function vCode(code) {
  code = (code || '').toUpperCase();
  const saved = store.get('mine', []).find(m => m.code === code);
  setTimeout(async () => {
    try {
      const plans = await (await fetch(BASE + 'data/plans.json', { cache: 'no-cache' })).json();
      const pl = plans.plans && plans.plans[code];
      if (!pl) throw new Error('none');
      const q = new URLSearchParams({ s: pl.s, c: code });
      if (pl.t) q.set('t', pl.t); if (pl.n) q.set('n', pl.n); if (pl.d) q.set('d', pl.d);
      location.replace('#/p?' + q.toString());
    } catch (e) {
      if (saved) return location.replace(saved.hash);
      $('#app').innerHTML = `<div class="empty-note">No practice plan has the code <b>${esc(code)}</b>. Check the letters with your teacher. (Codes never use 0, 1, O, I or L.)</div>${codeBox()}`;
    }
  });
  return `<div class="empty-note">Looking up ${esc(code)}…</div>`;
}
function codeBox() {
  const mine = store.get('mine', []);
  return `<form class="codebox" data-form="code">
    <label for="codein"><b>Have a practice code from your teacher?</b></label>
    <div class="row"><input id="codein" class="inp" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. K7QM4" aria-label="Practice code">
    <button class="btn primary">Open</button></div>
    ${mine.length ? `<div class="mine"><span class="muted">Your plans on this device:</span> ${mine.map(m => `<a class="pill" href="${esc(m.hash)}"><b>${esc(m.code)}</b> ${esc(m.title)}</a>`).join(' ')}</div>` : ''}
  </form>`;
}
function vQuiz(code, params) {
  const p = P.get(code);
  if (!p || !PX[code]) return vMissing();
  const back = params.get('back');
  setTimeout(async () => {
    const el = $('#quiz');
    try {
      const set = await (await fetch(BASE + 'practice/' + code + '.json', { cache: 'no-cache' })).json();
      if (!window.NWAPractice) await loadScript(BASE + 'practice.js');
      window.NWAPractice.mount(el, set, { back: back || `#/course/${p.course}` });
    } catch (e) { el.innerHTML = '<div class="empty-note">Could not load these problems. Check your connection and try again.</div>'; }
  });
  return `<div class="crumbs">${back ? `<a href="${esc(back)}">Practice list</a>` : `<a href="#/course/${p.course}">${esc(C.get(p.course).name)}</a>`} / ${p.code}</div>
  <div class="phead"><div><h1 style="font-size:clamp(22px,3.4vw,30px)">${esc(p.text)}</h1>
    <p>${p.code} · ${esc(C.get(p.course).name)} · each try gives new numbers; your score stays on this device.</p></div></div>
  <div id="quiz" class="quiz"><div class="empty-note">Loading problems…</div></div>`;
}

function vMissing() {
  return '<div class="empty-note">Page not found. <a href="#/">Back to the program</a></div>';
}

/* ───────────────────────── modal ───────────────────────── */

function modal(html) {
  $('#modalbody').innerHTML = html;
  $('#scrim').classList.add('on');
  const f = $('#modalbody [autofocus]') || $('#scrim .x');
  f && f.focus();
}
function closeModal() { $('#scrim').classList.remove('on'); }

function cellModal(tid, cid) {
  const t = T.get(tid), c = C.get(cid), ps = inCell(tid, cid), txt = t.cells?.[cid] || '';
  const fl = flagsAt(tid, cid);
  modal(`
    <span class="pill" style="--c:${sc(t.strand)}"><span class="dot"></span>${esc(S.get(t.strand).name)}</span>
    <h2 style="margin-top:10px">${esc(t.name)} · ${esc(c.name)}</h2>
    ${WS ? `<label class="muted" style="display:block;font-size:12px;font-weight:700;margin-top:14px;text-transform:uppercase;letter-spacing:.05em">Cell description (what the template cell says)</label>
      <textarea class="inp" id="celltext" autofocus placeholder="Short description, or leave blank for n/a">${esc(txt)}</textarea>
      <div class="ws-row"><button class="btn small primary" data-act="saveCell" data-thread="${tid}" data-course="${cid}">Save description</button></div>`
      : `<p class="lead">${esc(txt || (ps.length ? '' : 'Not covered in this course.'))}</p>`}
    ${fl.map(f => `<p><span class="tag ${f.kind}">${KIND[f.kind] || f.kind}</span> ${esc(f.text)}</p>`).join('')}
    ${ps.length ? `<ul class="plist">${ps.map(p => profRow(p, { showThread: false })).join('')}</ul>` : ''}
    <div class="ws-row" style="margin-top:14px">
      <a class="btn small" href="#/thread/${tid}" data-act="close">Follow this thread →</a>
      <a class="btn small" href="#/course/${cid}" data-act="close">Open ${esc(c.short)} →</a>
    </div>`);
}

function promptModal(title, fields, onSave) {
  modal(`<h2>${esc(title)}</h2>
    ${fields.map((f, i) => `<label class="muted" style="display:block;font-size:12px;font-weight:700;margin-top:14px;text-transform:uppercase;letter-spacing:.05em" for="pf${i}">${esc(f.label)}</label>
      ${f.type === 'textarea' ? `<textarea class="inp" id="pf${i}" ${i ? '' : 'autofocus'}>${esc(f.value || '')}</textarea>`
      : f.type === 'select' ? `<select class="inp" id="pf${i}" style="width:100%">${f.options.map(([v, l]) => `<option value="${esc(v)}" ${v === f.value ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`
      : f.type === 'file' ? `<input class="inp" id="pf${i}" type="file" style="width:100%">`
      : `<input class="inp" id="pf${i}" style="width:100%" value="${esc(f.value || '')}" placeholder="${esc(f.placeholder || '')}" ${i ? '' : 'autofocus'}>`}
      ${f.help ? `<div class="muted" style="font-size:12px;margin-top:4px">${esc(f.help)}</div>` : ''}`).join('')}
    <div class="ws-row" style="margin-top:16px"><button class="btn primary" id="pfsave">Save</button><button class="btn ghost" data-act="close">Cancel</button></div>`);
  $('#pfsave').onclick = async () => {
    const vals = fields.map((f, i) => f.type === 'file' ? $('#pf' + i).files[0] : $('#pf' + i).value.trim());
    $('#pfsave').disabled = true;
    try { await onSave(vals); closeModal(); } catch (e) { $('#pfsave').disabled = false; }
  };
}

const fileToB64 = f => new Promise((res, rej) => {
  const r = new FileReader();
  r.onload = () => res(String(r.result).split(',')[1]);
  r.onerror = rej;
  r.readAsDataURL(f);
});

/* ───────────────────────── Excel ───────────────────────── */

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src));
    document.head.appendChild(s);
  });
}

async function exportXlsx() {
  toast('Building spreadsheet…');
  if (!window.XLSX) await loadScript(VENDOR.xlsx);
  const X = window.XLSX, wb = X.utils.book_new();
  const head = ['Thread', ...D.courses.map(c => `${c.name} (${c.grade})`), 'Notes'];
  const over = [
    [`${D.title} — Scope and Sequence ${D.year}`], [D.status === 'draft' ? 'DRAFT for department review' : `Published ${D.published || ''}`], [],
    ['One tab per strand. Columns are courses; rows are the threads shared across courses.'],
    ['Each cell is a short description of that thread in that course, or n/a if the course does not cover it.'],
    ['The full list of proficiencies is on the last tab.'], [],
    ['Strand', 'Threads', 'Summary'],
    ...D.strands.map(s => [s.name, threadsOf(s.id).length, s.summary]),
  ];
  const ws0 = X.utils.aoa_to_sheet(over);
  ws0['!cols'] = [{ wch: 34 }, { wch: 9 }, { wch: 110 }];
  X.utils.book_append_sheet(wb, ws0, 'Overview');
  for (const s of D.strands) {
    const rows = [head, ...threadsOf(s.id).map(t => [t.name, ...D.courses.map(c => {
      const ps = inCell(t.id, c.id), txt = t.cells?.[c.id];
      return txt || (ps.length ? ps.map(p => p.text).join('; ') : 'n/a');
    }), t.note || ''])];
    const ws = X.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{ wch: 30 }, ...D.courses.map(() => ({ wch: 28 })), { wch: 40 }];
    X.utils.book_append_sheet(wb, ws, s.name.replace(/[\\/?*[\]:]/g, '').slice(0, 31));
  }
  const all = [['Code', 'Course', 'Unit', 'Proficiency', 'Strand', 'Thread'],
    ...live().map(p => [p.code, C.get(p.course).name, p.unit || '', p.text, strandOf(p)?.name || '', T.get(p.thread)?.name || ''])];
  const wsA = X.utils.aoa_to_sheet(all);
  wsA['!cols'] = [{ wch: 10 }, { wch: 24 }, { wch: 30 }, { wch: 80 }, { wch: 28 }, { wch: 34 }];
  X.utils.book_append_sheet(wb, wsA, 'All proficiencies');
  X.writeFile(wb, `NWA Math Scope and Sequence ${D.year.replace('–', '-')}.xlsx`);
}

/* ───────────────────────── router ───────────────────────── */

function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { parts, params: new URLSearchParams(qs || '') };
}

function render() {
  const { parts, params } = route();
  const [v, id] = parts;
  let html, tab = '';
  switch (v) {
    case 'course': html = vCourse(id); tab = 'home'; break;
    case 'scope': html = vScope(id); tab = 'scope'; break;
    case 'thread': html = vThread(id); tab = 'scope'; break;
    case 'review': html = vReview(); tab = 'review'; break;
    case 'assign': html = vAssign(params); tab = 'assign'; break;
    case 'p': html = vPractice(params); tab = ''; break;
    case 'c': html = vCode(id); tab = ''; break;
    case 'q': html = vQuiz(id, params); tab = ''; break;
    default: html = vHome(); tab = 'home';
  }
  $('#app').innerHTML = html;
  $$('nav.tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  document.body.classList.toggle('student', v === 'p' || v === 'c' || (v === 'q' && params.has('back')));
  const t = { course: C.get(id)?.name, scope: 'Scope & Sequence', thread: T.get(id)?.name, review: 'Department review', assign: 'Assign practice', p: params.get('t') || 'Practice', q: id, c: 'Practice code' }[v];
  document.title = (t ? t + ' · ' : '') + 'NWA Math';
}

let lastPath = '';
function onRoute() {
  closeModal();
  const p = location.hash.split('?')[0];
  render();
  if (p !== lastPath) window.scrollTo(0, 0);
  lastPath = p;
}

/* ───────────────────────── events ───────────────────────── */

function assignSet(fn) { const st = assignState(); fn(st); store.set('assign', st); }

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  if (el.getAttribute('href') === '#') e.preventDefault();
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'close': closeModal(); break;
    case 'theme': {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next; store.set('theme', next); break;
    }
    case 'xlsx': exportXlsx().catch(err => toast(err.message)); break;
    case 'glance': location.hash = `#/scope/${d.strand}`; break;
    case 'strand': location.hash = `#/scope/${d.strand}`; break;
    case 'cell': cellModal(d.thread, d.course); break;
    case 'courseMode': store.set('courseMode', d.mode); render(); break;
    case 'ovFilter': store.set('ovFilter', d.f); render(); break;
    case 'aCourse': assignSet(st => { st.course = d.course; st.q = ''; }); render(); break;
    case 'pickAll': assignSet(st => { for (const c of d.codes.split(' ')) if (!st.picked.includes(c)) st.picked.push(c); }); render(); break;
    case 'unpick': assignSet(st => { st.picked = st.picked.filter(c => c !== d.code); }); render(); break;
    case 'clearPicked': assignSet(st => { st.picked = []; }); render(); break;
    case 'makeLink': {
      const st = assignState(), url = practiceUrl(st);
      const out = $('#linkout');
      out.innerHTML = `<div class="linkbox"><input class="inp" readonly value="${esc(url)}" id="plink"><button class="btn small" data-act="copy">Copy</button></div>
        <div class="ws-row"><a class="btn small" href="${esc(url)}" target="_blank" rel="noopener">Preview</a><button class="btn small" data-act="copyEmail">Copy email text</button></div>
        <div id="qr" aria-label="QR code for the practice link"></div>
        ${WS ? '<div class="ws-row"><button class="btn small primary" data-act="makeCode">Make a class code</button><span class="muted small">A short code students type into the site.</span></div><div id="codeout"></div>'
             : '<p class="muted small">Need a short code students can type in? Make the list in the Workshop.</p>'}`;
      try {
        if (!window.qrcode) await loadScript(VENDOR.qr);
        const q = window.qrcode(0, 'M'); q.addData(url); q.make();
        $('#qr').innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      } catch (err) { $('#qr').remove(); }
      break;
    }
    case 'copy': navigator.clipboard.writeText($('#plink').value).then(() => toast('Link copied')); break;
    case 'makeCode': {
      const st = assignState();
      el.disabled = true;
      try {
        const r = await api({ op: 'savePlan', s: encodeCodes(st.picked), t: st.title, n: st.note, d: st.due });
        $('#codeout').innerHTML = `<div class="bigcode">${esc(r.code)}</div>
          <p class="small">Students open <b>${esc(PUBLIC_URL.replace(/^https:\/\//, ''))}</b>, type <b>${esc(r.code)}</b>, and get this list with its practice problems.
          ${r.live ? 'It works now.' : 'It works after the next publish (no GitHub token yet).'}</p>`;
      } catch (err) { toast('No code: ' + (err.message || err)); el.disabled = false; }
      break;
    }
    case 'copyEmail': {
      const st = assignState();
      const txt = `${st.title || 'Math practice'}\n\n${st.note ? st.note + '\n\n' : ''}Your practice list (${st.picked.length} proficiencies)${st.due ? ', due ' + st.due : ''}:\n${$('#plink').value}\n\nEach item has links to practice resources. Check things off as you go.`;
      navigator.clipboard.writeText(txt).then(() => toast('Email text copied')); break;
    }
    /* ── workshop edits ── */
    case 'saveCell': await edit({ op: 'setCell', thread: d.thread, course: d.course, text: $('#celltext').value.trim() }); cellModal(d.thread, d.course); break;
    case 'editProf': {
      const p = P.get(d.code);
      promptModal(`Edit ${p.code}`, [{ label: 'Proficiency wording (imperative voice, sentence case)', type: 'textarea', value: p.text, help: 'The old wording is kept as history.' }],
        ([text]) => text && text !== p.text ? edit({ op: 'editProf', code: p.code, text }) : Promise.resolve());
      break;
    }
    case 'retire': {
      const p = P.get(d.code);
      if (confirm(`Retire ${p.code}: “${p.text}”?\n\nIt disappears from the site. The code is never reused, and old practice links will say it is no longer in the curriculum.`))
        await edit({ op: 'retireProf', code: p.code }, `${p.code} retired`);
      break;
    }
    case 'addProf': {
      const c = C.get(d.course), units = [...new Set(ofCourse(c.id).map(p => p.unit).filter(Boolean))];
      promptModal(`New proficiency in ${c.name}`, [
        { label: 'Proficiency', placeholder: 'e.g. Graph rational functions and identify asymptotes' },
        { label: 'Unit (optional)', value: units[units.length - 1] || '', placeholder: 'e.g. Unit 3: Polynomials' },
        { label: 'Thread', type: 'select', value: D.threads[0].id, options: D.threads.map(t => [t.id, `${S.get(t.strand).name} › ${t.name}`]) },
      ], ([text, unit, thread]) => text ? edit({ op: 'addProf', course: c.id, unit, text, thread }, 'Proficiency added') : Promise.resolve());
      break;
    }
    case 'addRes': {
      const p = P.get(d.code);
      promptModal(`Add a resource for ${p.code}`, [
        { label: 'Title', placeholder: 'e.g. Khan Academy: Graphing rational functions' },
        { label: 'Link', placeholder: 'https://…', help: 'Paste a link, or choose a file below instead.' },
        { label: 'Or upload a file (PDF, image, doc)', type: 'file' },
        { label: 'Kind', type: 'select', value: 'video', options: [['video', 'Video'], ['practice', 'Practice problems'], ['notes', 'Notes'], ['interactive', 'Interactive'], ['link', 'Other link']] },
      ], async ([title, url, file, kind]) => {
        if (file) {
          if (file.size > 20e6) { toast('Files must be under 20 MB'); throw new Error('too big'); }
          return edit({ op: 'uploadResource', code: p.code, title: title || file.name, kind, name: file.name, mime: file.type, b64: await fileToB64(file) }, 'Uploaded');
        }
        if (!/^https?:\/\//.test(url)) { toast('Paste a full link starting with https://'); throw new Error('bad url'); }
        return edit({ op: 'addResource', code: p.code, title: title || url, url, kind }, 'Resource added');
      });
      break;
    }
    case 'renameThread': {
      const t = T.get(d.thread);
      promptModal('Rename thread', [{ label: 'Thread name', value: t.name }], ([name]) => name ? edit({ op: 'renameThread', thread: t.id, name }) : Promise.resolve());
      break;
    }
    case 'threadNote': {
      const t = T.get(d.thread);
      promptModal(`Note on “${t.name}”`, [{ label: 'Note (shows in the template’s Notes column)', type: 'textarea', value: t.note }], ([note]) => edit({ op: 'setThreadNote', thread: t.id, note }));
      break;
    }
    case 'addThread': {
      const s = S.get(d.strand);
      promptModal(`New thread in ${s.name}`, [{ label: 'Thread name', placeholder: 'e.g. Rational functions' }], ([name]) => name ? edit({ op: 'addThread', strand: s.id, name }, 'Thread added') : Promise.resolve());
      break;
    }
    case 'decide': {
      const o = D.overlaps.find(x => x.id === d.id);
      const status = o.status === d.status ? 'open' : d.status;
      await edit({ op: 'decideOverlap', id: o.id, status, note: o.note || '' }, status === 'open' ? 'Reopened' : 'Decided');
      break;
    }
    case 'flag': await edit({ op: 'setFlag', id: d.id, status: d.status }); break;
    case 'addFlag': promptModal('Raise a question for the department', [
        { label: 'Question or issue', type: 'textarea' },
        { label: 'Kind', type: 'select', value: 'todo', options: Object.entries(KIND) },
        { label: 'Course', type: 'select', value: D.courses[0].id, options: D.courses.map(c => [c.id, c.name]) },
        { label: 'Thread', type: 'select', value: D.threads[0].id, options: D.threads.map(t => [t.id, `${S.get(t.strand).name} › ${t.name}`]) },
      ], ([text, kind, course, thread]) => text ? edit({ op: 'addFlag', text, kind, course, thread }, 'Question added') : Promise.resolve());
      break;
    case 'refresh': google.script.run.withSuccessHandler(data => { D = data; index(); render(); toast('Up to date'); }).getData(); break;
    case 'publish':
      if (confirm('Publish the current Sheet to the public site?\n\nThis replaces what parents and students see. Every published version is kept in GitHub history.'))
        google.script.run.withSuccessHandler(r => toast(r)).withFailureHandler(err => toast('Publish failed: ' + err.message)).publish();
      break;
  }
});

document.addEventListener('change', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a === 'pick') { assignSet(st => { st.picked = el.checked ? [...new Set([...st.picked, d.code])] : st.picked.filter(c => c !== d.code); }); render(); }
  if (a === 'review') { store.set('review', el.checked); render(); }
  if (a === 'ovShow') { store.set('ovShow', el.checked); render(); }
  if (a === 'did') {
    const done = new Set(store.get(d.key, []));
    el.checked ? done.add(d.code) : done.delete(d.code);
    store.set(d.key, [...done]); render();
  }
  if (a === 'prepare' && el.value) {
    const target = el.value, ts = new Set(ofCourse(target).map(p => p.thread));
    const prior = live().filter(p => FEEDS[target].includes(p.course) && ts.has(p.thread)).map(p => p.code);
    assignSet(st => { st.picked = [...new Set([...st.picked, ...prior])]; if (!st.title) st.title = `Summer prep for ${C.get(target).name}`; st.course = FEEDS[target][0]; st.q = ''; });
    toast(`${prior.length} proficiencies from ${FEEDS[target].map(c => C.get(c).short).join(' / ')} that lead into ${C.get(target).short}`);
    render();
  }
  if (a === 'move') {
    const p = P.get(d.code);
    if (el.value !== p.thread) await edit({ op: 'moveProf', code: p.code, thread: el.value }, `${p.code} → ${T.get(el.value).name}`);
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'aq') {
    assignSet(st => { st.q = e.target.value; });
    const pos = e.target.selectionStart;
    render();
    const i = $('#aq'); i.focus(); i.setSelectionRange(pos, pos);
  }
  if (['at', 'an', 'ad'].includes(e.target.id)) assignSet(st => { st[{ at: 'title', an: 'note', ad: 'due' }[e.target.id]] = e.target.value; });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'code') return;
  e.preventDefault();
  const code = $('#codein').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!CODE_RE.test(code)) { toast('Codes are 5 letters and numbers, like K7QM4'); return; }
  location.hash = '#/c/' + code;
});

/* ───────────────────────── boot ───────────────────────── */

function shell() {
  document.body.classList.toggle('ws', WS);
  document.documentElement.dataset.theme = store.get('theme', matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.body.innerHTML = `
  ${WS ? `<div class="ws-banner"><b>Workshop</b> · editing the shared draft as ${esc(window.NWA_USER || 'you')} · changes save straight to the department Sheet
    · <a href="#" data-act="refresh" style="color:#fff;text-decoration:underline">refresh</a>${window.NWA_CHAIR ? ' · <a href="#" data-act="publish" style="color:#fff;text-decoration:underline">publish to public site</a>' : ''}</div>` : ''}
  <header id="bar"><div class="in">
    <a class="brand" href="#/"><img src="${WS ? PUBLIC_URL : ''}icons/icon-192.png" alt=""><span>NWA Math<small>Proficiencies · ${esc(D.year)}</small></span></a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/" data-tab="home">Courses</a>
      <a href="#/scope/${D.strands[0].id}" data-tab="scope">Scope &amp; Sequence</a>
      <a href="#/assign" data-tab="assign">Assign practice</a>
      <a href="#/review" data-tab="review">Review</a>
    </nav>
    <button class="iconbtn" data-act="theme" title="Light / dark" aria-label="Toggle light or dark theme">${icon.sun}</button>
  </div></header>
  <main id="app"></main>
  <footer>Northwest Academy Mathematics Department · ${esc(D.year)}${D.published ? ' · published ' + esc(D.published) : ''} · Proficiency codes are permanent: a retired code is never reused.</footer>
  <div class="scrim" id="scrim" data-act-scrim><div class="modal" role="dialog" aria-modal="true"><button class="iconbtn x" data-act="close" aria-label="Close">${icon.x}</button><div id="modalbody"></div></div></div>
  <div id="toast" role="status"></div>`;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeModal(); });
}

(async () => {
  try {
    await load();
    await loadPractice();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:40px;font:16px sans-serif">Could not load the curriculum data. Check your connection and reload.</p>';
    return;
  }
  shell();
  window.addEventListener('hashchange', onRoute);
  onRoute();
  if (!WS && 'serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
